server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 location / { try_files $uri $uri/ /index.html; }
 location /api/users { proxy_pass http://user-service:8081/users; proxy_set_header Host $host; }
 location /api/products { proxy_pass http://product-service:8082/products; proxy_set_header Host $host; }
 location /api/inventory { proxy_pass http://inventory-service:8083/inventory; proxy_set_header Host $host; }
 location /api/orders { proxy_pass http://order-service:8084/orders; proxy_set_header Host $host; }
 location /api/payments { proxy_pass http://payment-service:8085/payments; proxy_set_header Host $host; }
}
